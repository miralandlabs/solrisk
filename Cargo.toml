[package]
name = "solrisk"
description = "x402-compliant Solana wallet risk / reputation scoring service"
repository = "https://github.com/miralandlabs/solrisk.git"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "risk_api"
path = "src/bin/risk_api.rs"

[dependencies]
# Core
anyhow = "1.0"
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"

# HTTP and serialization
http = "1.0"
vercel_runtime = "1.1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_qs = "0.14"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }

# Solana dependencies for chain signal collection + x402 verification
solana-client = "^2.1"
solana-program = "^2.1"
solana-rpc-client = "^2.1"
solana-rpc-client-api = "^2.1"
solana-sdk = "^2.1"
solana-transaction-status = "^2.1"
solana-commitment-config = "^2.1"
solana-compute-budget-interface = "^2.2"
spl-associated-token-account = { version = "^6", features = ["no-entrypoint"] }
spl-token = { version = "^4", features = ["no-entrypoint"] }

# External requests
reqwest = { version = "0.11", features = ["json"] }
rand = "0.10.0"

# Optional Postgres parameters (pr402-compatible `parameters` table) + solrisk tables
deadpool-postgres = { version = "0.14", features = ["serde"] }
tokio-postgres = "0.7"
postgres-openssl = "0.5"
openssl = "0.10"
